name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly, because content rots without any commit: an OSS repository can be
    # renamed or deleted, and a referenced URL can die.
    - cron: "13 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  tools:
    name: tooling
    uses: rustly-tech/.github/.github/workflows/rust-ci.yml@main
    with:
      msrv: "1.88.0"
      features: ""

  content:
    name: validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: content

      # `tools` is a member of the workspace at the repository root, so the
      # binary lands in ./target/release, not tools/target/release.
      - name: Build the tooling
        run: cargo build --release -p rustly-content

      - name: Schema, identifier, reference, and attribution validation
        run: ./target/release/rustly-content validate

      # The Rust types are the schema. Committed JSON Schema files are generated
      # from them, so drift is impossible rather than merely discouraged.
      - name: Committed schemas match the Rust types
        run: ./target/release/rustly-content schemas --check

      # Every runnable example declares what it does. A broken-on-purpose example
      # must still fail in the way it claims, or predict-the-error teaches noise.
      - name: Every example does what it claims
        run: ./target/release/rustly-content check-examples

      # A Trial whose own reference solution fails is unshippable, and a starter
      # that already compiles when it claims E0382 removes the whole exercise.
      - name: Starters and reference solutions behave as declared
        run: ./target/release/rustly-content check-trials

      - name: Build the static search index
        run: |
          ./target/release/rustly-content index
          test -s dist/search-index.json
          echo "index size: $(wc -c < dist/search-index.json) bytes"

      - name: Upload the index
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-index
          path: dist/search-index.json
          retention-days: 7

  attribution:
    name: OSS attribution is live
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Attribution metadata can be internally consistent and still wrong: the
      # commit may not exist, the file may have been deleted, or the excerpt may
      # run past the end of the file. This checks the claim against reality.
      - name: Every pinned commit, path, and line range resolves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failures=0
          for file in $(find content/oss -name '*.json'); do
            repo=$(jq -r .repository "$file")
            commit=$(jq -r .commit "$file")
            path=$(jq -r .path "$file")
            start=$(jq -r .line_start "$file")
            end=$(jq -r .line_end "$file")
            id=$(jq -r .id "$file")

            if ! gh api "repos/$repo/commits/$commit" --jq .sha > /dev/null 2>&1; then
              echo "::error file=$file::$id: commit $commit does not exist in $repo"
              failures=$((failures + 1))
              continue
            fi

            if ! gh api "repos/$repo/contents/$path?ref=$commit" --jq .content 2>/dev/null \
                 | base64 -d > /tmp/excerpt.txt; then
              echo "::error file=$file::$id: $path does not exist at $commit"
              failures=$((failures + 1))
              continue
            fi

            lines=$(wc -l < /tmp/excerpt.txt)
            if [ "$end" -gt "$lines" ]; then
              echo "::error file=$file::$id: line_end $end is past the end of $path ($lines lines)"
              failures=$((failures + 1))
              continue
            fi
            echo "ok  $id -> $repo@${commit:0:8} $path:$start-$end"
          done
          [ "$failures" -eq 0 ] || { echo "$failures attribution failure(s)"; exit 1; }

  judge-compatibility:
    name: Trials are judgeable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: judge-compat

      # `tools` is a member of the workspace at the repository root, so the
      # binary lands in ./target/release, not tools/target/release.
      - name: Build the tooling
        run: cargo build --release -p rustly-content

      # Public CI proves the public package parses. Trusted solutions and hidden
      # cases are validated only in the private evaluation repository.
      #
      # Written in Python rather than shell on purpose: an expected output is a
      # multi-line string, and word-splitting one in a shell loop compares
      # meaningless fragments. The first version of this check "found" a leak
      # because the fragment `out` appears in the key `expected_stdout`.
      - name: Every emitted package parses as a judge Trial package
        run: |
          set -euo pipefail
          for trial in content/trials/*/trial.json; do
            slug=$(python3 -c "import json,sys;print(json.load(open('$trial'))['slug'])")
            ./target/release/rustly-content package "$slug" > "/tmp/$slug.json"
            python3 - "$slug" <<'PYEOF'
          import json, sys

          slug = sys.argv[1]
          full = json.load(open(f"/tmp/{slug}.json"))

          assert full["format_version"] == 1, "unexpected package format version"
          assert full["tests"], "the package has no tests"
          assert all(t["visibility"] == "public" for t in full["tests"]), "non-public test leaked"
          assert full["limits"]["fuel"] > 0, "fuel is unbounded"
          assert full["limits"]["wall_ms"] > 0, "wall clock is unbounded"

          print(f"ok  {slug}: {len(full['tests'])} public tests")
          PYEOF
          done

  links:
    name: reference links resolve
    runs-on: ubuntu-slim
    # Informational: an upstream site being down must not block a content PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every cited URL
        run: |
          set -uo pipefail
          failures=0
          urls=$(grep -rho 'https://[^"]*' content --include='*.json' | sort -u)
          for url in $urls; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 "$url" || echo 000)
            if [ "$code" -ge 400 ] || [ "$code" = "000" ]; then
              echo "::warning::$url returned $code"
              failures=$((failures + 1))
            else
              echo "ok  $code $url"
            fi
          done
          echo "$failures unreachable link(s)"
